name: Sinyal Saham

on:
  schedule:
    - cron: "45 1 * * 1-5"    # 08:45 WIB -> sinyal pagi
    - cron: "30 7 * * 1-5"    # 14:30 WIB -> sinyal sore
    - cron: "0 3 * * 1-5"     # 10:00 WIB -> scan scalping
    - cron: "0 5 * * 1-5"     # 12:00 WIB -> scan scalping
    - cron: "50 8 * * 1-5"    # 15:50 WIB -> evaluasi sinyal hari ini
  workflow_dispatch:
    inputs:
      aksi:
        description: "pagi / sore / scalping / evaluasi"
        default: "pagi"

permissions:
  contents: write   # perlu buat commit riwayat sinyal balik ke repo

jobs:
  jalankan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install browser untuk scraping IDX
        run: python -m playwright install --with-deps chromium

      - name: Tentukan aksi berdasarkan waktu cron
        id: aksi
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "aksi=${{ github.event.inputs.aksi }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "45 1 * * 1-5" ]; then
            echo "aksi=pagi" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 7 * * 1-5" ]; then
            echo "aksi=sore" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "50 8 * * 1-5" ]; then
            echo "aksi=evaluasi" >> $GITHUB_OUTPUT
          else
            echo "aksi=scalping" >> $GITHUB_OUTPUT
          fi

      - name: Jalankan sinyal pagi/sore
        if: steps.aksi.outputs.aksi == 'pagi' || steps.aksi.outputs.aksi == 'sore'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run_analysis.py ${{ steps.aksi.outputs.aksi }}

      - name: Jalankan scan scalping
        if: steps.aksi.outputs.aksi == 'scalping'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scan_scalping.py

      - name: Jalankan evaluasi sinyal
        if: steps.aksi.outputs.aksi == 'evaluasi'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python evaluate_signals.py

      - name: Simpan riwayat sinyal ke repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add signals_history.json
          git diff --staged --quiet || git commit -m "update riwayat sinyal"
          git push
